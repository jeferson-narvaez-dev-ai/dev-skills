[project]
name = "dev-skills"
version = "1.0.0"
description = "Personal Claude Code skills — Obsidian integration and dev utilities"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.scripts]
dev-skills = "dev_skills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_skills"]
include = ["src/dev_skills/data/**"]
